<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikerio Design | Kinetic Typo Lab</title>
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('giorno_01/fonts/Geist-Regular.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Geist';
            src: url('giorno_01/fonts/Geist-Black.woff2') format('woff2');
            font-weight: 900;
        }

        :root {
            --bg-dark: #2B1E16;
            --accent-light: #f5f5dc;
            --main-font: 'Geist', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background-color: var(--bg-dark); 
            font-family: var(--main-font);
            overflow: hidden;
            color: var(--accent-light);
        }

        header {
            position: fixed;
            top: 0; width: 100%; padding: 50px 60px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 9999; pointer-events: none;
        }

        .header-left { text-align: left; line-height: 1.2; pointer-events: auto; }
        .workshop-info { font-size: 13px; font-weight: 900; text-transform: uppercase; }
        .sub-info { font-size: 11px; font-weight: 400; text-transform: uppercase; opacity: 0.6; }

        .header-buttons { 
            display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; 
            justify-content: flex-end; max-width: 800px;
        }

        .btn-variant {
            background: transparent; border: 1.5px solid var(--accent-light);
            color: var(--accent-light); padding: 6px 15px; font-family: var(--main-font);
            font-size: 9px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; border-radius: 50px; transition: all 0.3s;
        }

        .btn-variant:hover, .btn-variant.active { background: var(--accent-light); color: var(--bg-dark); }

        .footer-container {
            position: fixed; bottom: 40px; width: 100%; padding: 0 60px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            z-index: 9999; pointer-events: none;
        }

        .btn-toggle {
            background: none; border: none; font-family: var(--main-font);
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--accent-light);
            opacity: 0.4; cursor: pointer; transition: all 0.3s; pointer-events: auto;
        }

        .btn-toggle.active { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
        
        .btn-reset {
            background: var(--accent-light); color: var(--bg-dark);
            border: none; padding: 10px 22px; font-family: var(--main-font);
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; border-radius: 50px; transition: all 0.3s; pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="workshop-info">Workshop 2</div>
            <div class="sub-info">ASCII Typography Lab</div>
        </div>
        <div class="header-buttons">
            <button class="btn-variant active" onclick="setVariant(1, this)">V.01 Points</button>
            <button class="btn-variant" onclick="setVariant(2, this)">V.02 ASCII</button>
            <button class="btn-variant" onclick="setVariant(3, this)">V.03 Matrix</button>
            <button class="btn-variant" onclick="setVariant(4, this)">V.04 Kikerio</button>
        </div>
    </header>

    <div class="footer-container">
        <button id="toggleNoise" class="btn-toggle active" onclick="this.classList.toggle('active')" style="text-align: left;">Noise On</button>
        <button class="btn-reset" onclick="resetSketch()">Reset View</button>
        <button id="toggleColor" class="btn-toggle" onclick="this.classList.toggle('active')" style="text-align: right;">Show Colors</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
    <script>
        let faccione;
        let modalita = 1;
        // Stringa ASCII riorganizzata: caratteri neri/pesanti per zone bianche del volto
        const asciiChars = "@#8W&MWB8NM".split(""); 
        const kikerioChars = "KIKERIO";

        function preload() {
            faccione = loadImage('mc.png');
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            faccione.resize(faccione.width / 3.5, 0); 
            // Forza Geist Black per peso massimo
            textFont('Geist');
            textAlign(CENTER, CENTER);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function setVariant(val, btn) {
            modalita = val;
            document.querySelectorAll('.btn-variant').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function resetSketch() {
            modalita = 1;
            setVariant(1, document.querySelectorAll('.btn-variant')[0]);
        }

        function draw() {
            background('#2B1E16'); 
            
            let numH = faccione.width;
            let numV = faccione.height;
            let d = 9; 
            let ox = (width - (numH - 1) * d) / 2;
            let oy = (height - (numV - 1) * d) / 2;

            let isNoiseActive = document.getElementById('toggleNoise').classList.contains('active');
            let showColors = document.getElementById('toggleColor').classList.contains('active');
            
            let amount = isNoiseActive ? mouseX * 0.2 : 0;

            let ny = frameCount * 0.011;
            let nx = frameCount * 0.031;
            let nz = frameCount * 0.014;

            for (let j = 0; j < numV; j++) {
                for (let i = 0; i < numH; i++) {
                    let col = faccione.get(i, j);
                    let al = alpha(col);
                    if (al < 50) continue; 

                    let br = brightness(col);
                    let px = ox + i * d;
                    let py = oy + j * d;

                    px += map(noise(i * 0.02 + nx, j * 0.02 + ny, nz), 0, 1, -amount, amount);
                    py += map(noise(i * 0.02 + nx, j * 0.02 + ny, nz + 5), 0, 1, -amount, amount);

                    if (showColors) {
                        fill(col);
                    } else {
                        // Opacità alta per zone chiare, bassa per ombre
                        let opacity = map(br, 0, 255, 30, 255);
                        fill(245, 245, 220, opacity);
                    }

                    if (modalita === 1) { // POINTS
                        noStroke();
                        let size = map(br, 0, 255, 0.5, d * 0.8);
                        circle(px, py, size); 
                    } 
                    else if (modalita === 2) { // ASCII GEIST BLACK
                        // Mappa la luminosità sull'indice dei caratteri pesanti
                        let charIndex = floor(map(br, 0, 255, 0, asciiChars.length - 1));
                        let tSize = map(br, 0, 255, 4, 12); 
                        
                        textStyle(900); // Forza Geist-Black
                        textSize(tSize);
                        text(asciiChars[charIndex], px, py);
                    } 
                    else if (modalita === 3) { // MATRIX
                        let binary = br > 110 ? "1" : "0";
                        textStyle(900);
                        textSize(8);
                        text(binary, px, py);
                    }
                    else if (modalita === 4) { // KIKERIO
                        let kIndex = (i + j + floor(frameCount * 0.1)) % kikerioChars.length;
                        let tSize = map(br, 0, 255, 3, 11);
                        textStyle(900);
                        textSize(tSize);
                        text(kikerioChars[kIndex], px, py);
                    }
                }
            }
        }
    </script>
</body>
</html>
