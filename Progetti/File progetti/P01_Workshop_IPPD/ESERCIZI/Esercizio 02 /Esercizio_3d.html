<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikerio Design | Kinetic 3D Lab</title>
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('giorno_01/fonts/Geist-Regular.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Geist';
            src: url('giorno_01/fonts/Geist-Black.woff2') format('woff2');
            font-weight: 900;
        }

        :root {
            --bg-light: #f5f5dc;
            --text-dark: #2B1E16;
            --main-font: 'Geist', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background-color: var(--bg-light); 
            font-family: var(--main-font);
            overflow: hidden;
            color: var(--text-dark);
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 50px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            pointer-events: none;
        }

        .header-left { text-align: left; line-height: 1.2; pointer-events: auto; }
        .workshop-info { font-size: 13px; font-weight: 900; text-transform: uppercase; }
        .sub-info { font-size: 11px; font-weight: 400; text-transform: uppercase; opacity: 0.6; }

        .header-buttons { 
            display: flex; 
            gap: 6px; 
            pointer-events: auto; 
            flex-wrap: wrap; 
            justify-content: flex-end;
            max-width: 600px;
        }

        .btn-variant {
            background: transparent; border: 1.5px solid var(--text-dark);
            color: var(--text-dark); padding: 6px 12px; font-family: var(--main-font);
            font-size: 9px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; border-radius: 50px; transition: all 0.3s;
        }

        .btn-variant:hover, .btn-variant.active { background: var(--text-dark); color: var(--bg-light); }

        .footer-container {
            position: fixed;
            bottom: 40px;
            width: 100%;
            padding: 0 60px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            z-index: 9999;
            pointer-events: none;
        }

        .btn-toggle {
            background: none; border: none; font-family: var(--main-font);
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--text-dark);
            opacity: 0.3; cursor: pointer; transition: all 0.3s; pointer-events: auto;
        }

        .btn-toggle.active { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
        .btn-reset {
            background: var(--text-dark); color: var(--bg-light);
            border: none; padding: 10px 22px; font-family: var(--main-font);
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; border-radius: 50px; transition: all 0.3s; pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="workshop-info">Workshop 2</div>
            <div class="sub-info">Generative Experiments</div>
        </div>
        <div class="header-buttons">
            <button class="btn-variant active" onclick="setVariant(1, this)">V.01 Normal</button>
            <button class="btn-variant" onclick="setVariant(2, this)">V.02 Trails</button>
            <button class="btn-variant" onclick="setVariant(3, this)">V.03 Möbius</button>
            <button class="btn-variant" onclick="setVariant(4, this)">V.04 Pixel-Sort</button>
        </div>
    </header>

    <div class="footer-container">
        <button id="toggleOrbit" class="btn-toggle active" onclick="this.classList.toggle('active')" style="text-align: left;">Orbit</button>
        <button class="btn-reset" onclick="resetView()">Reset / Clear</button>
        <button id="toggleFollow" class="btn-toggle active" onclick="this.classList.toggle('active')" style="text-align: right;">Follow</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
    <script>
        let shape, tex;
        let rx = 0, ry = 0;
        let modalita = 1;
        let isResetting = false;
        let baseRotX = 170; let baseRotY = 190;

        function preload() {
            shape = loadModel('mc/mc.obj', true);
            tex = loadImage('mc/mc.jpg');
        }

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            angleMode(DEGREES);
            background('#f5f5dc');
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); background('#f5f5dc'); }

        function setVariant(val, btn) {
            modalita = val;
            document.querySelectorAll('.btn-variant').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            background('#f5f5dc');
        }

        function resetView() {
            isResetting = true;
            setTimeout(() => { isResetting = false; }, 800);
            background('#f5f5dc');
        }

        function draw() {
            // LOGICA SCIA: Feedback ON per 2, 3, 4
            if (modalita !== 2 && modalita !== 3 && modalita !== 4) {
                background('#f5f5dc');
            }

            ambientLight(120);
            directionalLight(255, 255, 255, 0, 0.5, -1);

            let canOrbit = document.getElementById('toggleOrbit').classList.contains('active');
            let canFollow = document.getElementById('toggleFollow').classList.contains('active');

            if (isResetting) {
                rx = lerp(rx, 0, 0.1); ry = lerp(ry, 0, 0.1);
            } else {
                if (mouseIsPressed && canOrbit) {
                    ry += movedX * 0.5; rx -= movedY * 0.5;
                } else if (canFollow) {
                    let targetRy = map(mouseX, 0, width, -40, 40);
                    let targetRx = map(mouseY, 0, height, 40, -40);
                    let ease = (modalita === 3) ? 1 : 0.05;
                    ry = lerp(ry, targetRy, ease);
                    rx = lerp(rx, targetRx, ease);
                }
            }

            push();
            
            if (modalita === 1) { // NORMAL
                rotateX(baseRotX + rx); rotateY(baseRotY + ry);
                scale(2.5); noStroke(); texture(tex); model(shape);
            } 
            
            else if (modalita === 2) { // TRAILS
                const rotX_auto = sin(frameCount * 0.5) * 40;
                const rotY_auto = cos(frameCount * 0.4) * 40;
                const scl_auto = sin(frameCount * 0.3) * 1.5 + 3.5;
                translate(sin(frameCount)*60, cos(frameCount)*60, 0);
                rotateX(baseRotX + rotX_auto + rx); rotateY(baseRotY + rotY_auto + ry);
                scale(scl_auto); noStroke(); texture(tex); model(shape);
            }

            else if (modalita === 3) { // MÖBIUS
                let dynamicScale = map(mouseY, height, 0, 0.4, 1.8);
                let orbitRadius = map(mouseX, 0, width, 50, 300);
                for(let i=0; i<3; i++) {
                    push();
                    rotateZ(frameCount * 1.5 + i * 120); translate(orbitRadius, 0, 0);
                    rotateX(baseRotX + rx); rotateY(baseRotY + ry);
                    scale(dynamicScale); noStroke(); texture(tex); model(shape);
                    pop();
                }
            }

            else if (modalita === 4) { // PIXEL-SORT (2 DIREZIONI)
                rotateX(baseRotX + rx); rotateY(baseRotY + ry);
                let stretchY = map(abs(movedY), 0, 50, 1, 5);
                let stretchX = map(abs(movedX), 0, 50, 1, 5);
                scale(2.5 * stretchX, 2.5 * stretchY, 1);
                noStroke(); texture(tex); model(shape);
            }
            pop();
        }
    </script>
</body>
</html>
