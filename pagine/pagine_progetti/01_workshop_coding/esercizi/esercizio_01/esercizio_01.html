<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikerio Design | Kinetic Lab Pro</title>
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('../../../../documenti/fonts/Geist-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --bg-light: #ffffff;
            --accent-dark: #000000;
            --main-font: 'Geist', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-light); 
            font-family: var(--main-font); 
            overflow: hidden; 
            color: var(--accent-dark);
        }

        #inputImage { display: none; }

        /* INTESTAZIONE UNIFORMATA - SOLO FRECCIA */
        .workshop-header {
            position: fixed;
            top: 30px;
            left: 40px;
            z-index: 9999;
            line-height: 1.2;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--accent-dark);
            font-family: var(--main-font);
            font-size: 24px;
            font-weight: 400;
            cursor: pointer;
            width: fit-content;
            transition: transform 0.3s ease;
            text-decoration: none;
            display: inline-block;
            line-height: 1;
        }
        .btn-back:hover { transform: translateX(-8px); }

        /* VARIANTI (TOP RIGHT) */
        .variant-container {
            position: fixed;
            top: 30px;
            right: 40px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }

        .btn-variant {
            background: transparent;
            border: 1px solid var(--accent-dark);
            color: var(--accent-dark);
            padding: 8px 16px;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
        }
        .btn-variant.active { background: var(--accent-dark); color: #fff; }

        /* CONTROLLI SLIDER (LEFT) */
        .controls-left {
            position: fixed; left: 40px; top: 50%; 
            transform: translateY(-50%); display: flex; align-items: center; 
            z-index: 9999;
        }

        .slider-label {
            font-size: 10px; font-weight: 400; text-transform: uppercase;
            writing-mode: vertical-rl; transform: rotate(180deg);
            margin-right: 10px; opacity: 0.5;
        }

        input[type=range] {
            -webkit-appearance: none; width: 150px; background: transparent;
            transform: rotate(-90deg); cursor: pointer; margin-left: -65px;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 1px; background: var(--accent-dark); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 10px; width: 10px; border-radius: 50%; background: var(--accent-dark); margin-top: -4.5px; }

        /* SHAPE CONTROLS (RIGHT) */
        .controls-right {
            position: fixed; right: 40px; top: 50%; 
            transform: translateY(-50%); display: flex; flex-direction: column; 
            gap: 15px; z-index: 9999; align-items: center;
        }

        .shape-btn {
            background: transparent; border: 1px solid rgba(0,0,0,0.1);
            color: var(--accent-dark); width: 42px; height: 42px;
            border-radius: 50%; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }
        .shape-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; }
        .shape-btn.active { background: rgba(0,0,0,0.05); border-color: var(--accent-dark); }

        /* FOOTER */
        .footer-ui {
            position: fixed; bottom: 30px; width: 100%; padding: 0 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 9999; pointer-events: none;
        }
        .footer-ui * { pointer-events: auto; }

        .btn-reset {
            background: var(--accent-dark); color: #fff; border: none;
            padding: 10px 22px; font-size: 10px; font-weight: 400; text-transform: uppercase;
            cursor: pointer; border-radius: 50px;
        }
    </style>
</head>
<body>

    <div class="workshop-header">
        <a href="../../01_workshop_coding.html" class="btn-back">←</a>
    </div>

    <img id="inputImage" src="mc.png">

    <div class="variant-container">
        <button class="btn-variant active" onclick="setVariant(1, this)">V.01 Particle Cloud</button>
        <button class="btn-variant" onclick="setVariant(2, this)">V.02 Fast ASCII</button>
    </div>

    <div class="controls-left">
        <span id="sliderLabel" class="slider-label">Size</span>
        <input type="range" id="sizeSlider" min="0.1" max="1.8" step="0.05" value="0.9">
    </div>

    <div class="controls-right" id="shapeControls">
        <button class="shape-btn active" onclick="setShape('circle', this)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button class="shape-btn" onclick="setShape('square', this)">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
        <button class="shape-btn" onclick="setShape('star', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </button>
    </div>

    <div class="footer-ui">
        <button id="toggleNoise" class="btn-variant active" onclick="this.classList.toggle('active')">Reaction On</button>
        <button class="btn-reset" onclick="location.reload()">Reset View</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
    <script>
        let imgData = [];
        let modalita = 1;
        let formaAttuale = 'circle';
        let gridWidth = 0, gridHeight = 0;
        let tempImg;
        const d = 5; 
        const asciiChars = "@#8W&MWB8NM".split(""); 

        function preload() {
            tempImg = loadImage('mc.png');
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pixelDensity(1);
            
            tempImg.resize(tempImg.width / 1.8, 0); 
            tempImg.loadPixels();
            
            let maxX = 0, maxY = 0;
            for (let j = 0; j < tempImg.height; j++) {
                for (let i = 0; i < tempImg.width; i++) {
                    let idx = (i + j * tempImg.width) * 4;
                    let r = tempImg.pixels[idx], a = tempImg.pixels[idx+3];
                    
                    if (a > 120 && r < 250) {
                        imgData.push({
                            origX: i * d, origY: j * d,
                            currX: i * d, currY: j * d,
                            br: r, noiseSeed: random(1000)
                        });
                        if(i * d > maxX) maxX = i * d;
                        if(j * d > maxY) maxY = j * d;
                    }
                }
            }
            gridWidth = maxX;
            gridHeight = maxY;
            rectMode(CENTER);
            noStroke();
            textFont('Geist');
        }

        function draw() {
            background(255); 
            
            const ox = (width - gridWidth) / 2;
            const oy = (height - gridHeight) / 2;
            
            const isNoiseOn = document.getElementById('toggleNoise').classList.contains('active');
            const sliderVal = document.getElementById('sizeSlider').value;
            const time = frameCount * 0.05;

            for (let p of imgData) {
                let drawX = ox + p.origX;
                let drawY = oy + p.origY;
                let val = 255 - p.br;

                if (val > 40) {
                    if (isNoiseOn) {
                        let dMouse = dist(mouseX, mouseY, ox + p.currX, oy + p.currY);
                        
                        if (modalita === 1) {
                            let radius = 180;
                            if (dMouse < radius) {
                                let force = (radius - dMouse) / radius;
                                let nX = (noise(p.noiseSeed, time) - 0.5) * 150 * force;
                                let nY = (noise(p.noiseSeed + 50, time) - 0.5) * 150 * force;
                                p.currX = lerp(p.currX, p.origX + nX, 0.2);
                                p.currY = lerp(p.currY, p.origY + nY, 0.2);
                            } else {
                                p.currX = lerp(p.currX, p.origX, 0.1);
                                p.currY = lerp(p.currY, p.origY, 0.1);
                            }
                            drawX = ox + p.currX;
                            drawY = oy + p.currY;
                        } else {
                            let radius = 130;
                            if (dMouse < radius) {
                                let force = (radius - dMouse) / radius;
                                drawX += (drawX - mouseX) * force * sliderVal;
                                drawY += (drawY - mouseY) * force * sliderVal;
                            }
                        }
                    }

                    fill(0);
                    if (modalita === 1) {
                        let size = map(val, 40, 255, 0.5, d * sliderVal);
                        if (formaAttuale === 'circle') circle(drawX, drawY, size);
                        else if (formaAttuale === 'square') rect(drawX, drawY, size, size);
                        else if (formaAttuale === 'star') drawStar(drawX, drawY, size/2.2, size/1.1, 5);
                    } else {
                        let charIdx = floor(map(val, 40, 255, 0, asciiChars.length - 1));
                        textSize(map(val, 40, 255, 3, 10));
                        text(asciiChars[charIdx], drawX, drawY);
                    }
                }
            }
        }

        function drawStar(x, y, r1, r2, n) {
            let angle = TWO_PI / n;
            let halfAngle = angle / 2.0;
            beginShape();
            for (let a = 0; a < TWO_PI; a += angle) {
                vertex(x + cos(a) * r2, y + sin(a) * r2);
                vertex(x + cos(a + halfAngle) * r1, y + sin(a + halfAngle) * r1);
            }
            endShape(CLOSE);
        }

        function setVariant(val, btn) {
            modalita = val;
            document.querySelectorAll('.btn-variant').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('sliderLabel').innerText = (val === 1) ? "Size" : "Chaos";
            document.getElementById('shapeControls').style.display = (val === 1) ? 'flex' : 'none';
        }

        function setShape(type, btn) {
            formaAttuale = type;
            document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
