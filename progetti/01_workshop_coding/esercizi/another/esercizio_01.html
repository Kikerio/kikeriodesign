<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikerio Design | Kinetic Lab Pro</title>
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('giorno_01/fonts/Geist-Regular.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Geist';
            src: url('giorno_01/fonts/Geist-Black.woff2') format('woff2');
            font-weight: 900;
        }

        :root {
            --bg-light: #f5f5dc;
            --accent-dark: #2B1E16;
            --main-font: 'Geist', sans-serif;
            --page-margin: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-light); 
            font-family: var(--main-font); 
            overflow: hidden; 
            color: var(--accent-dark);
        }

        header {
            position: fixed; top: 0; width: 100%; padding: 50px var(--page-margin);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 9999; pointer-events: none;
        }

        .header-left { text-align: left; line-height: 1.2; pointer-events: auto; }
        .workshop-info { font-size: 13px; font-weight: 900; text-transform: uppercase; }
        .sub-info { font-size: 11px; font-weight: 400; text-transform: uppercase; opacity: 0.6; }

        #inputImage { display: none; }

        .controls-left {
            position: fixed; left: var(--page-margin); top: 50%; 
            transform: translateY(-50%); display: flex; align-items: center; 
            z-index: 9999; pointer-events: auto;
        }

        .slider-label {
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--accent-dark);
            writing-mode: vertical-rl; transform: rotate(180deg);
            white-space: nowrap; margin-right: 10px;
        }

        input[type=range] {
            -webkit-appearance: none; width: 150px; background: transparent;
            transform: rotate(-90deg); cursor: pointer; margin-left: -65px;
        }
        
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 1.5px; background: var(--accent-dark); opacity: 0.4; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--accent-dark); margin-top: -5px; }

        .controls-right {
            position: fixed; right: var(--page-margin); top: 50%; 
            transform: translateY(-50%); display: flex; flex-direction: column; 
            gap: 15px; z-index: 9999; pointer-events: auto; align-items: center;
        }

        .header-buttons { display: flex; gap: 6px; pointer-events: auto; }
        .btn-variant {
            background: transparent; border: 1.5px solid var(--accent-dark);
            color: var(--accent-dark); padding: 6px 15px; font-size: 9px; font-weight: 900;
            text-transform: uppercase; cursor: pointer; border-radius: 50px; transition: all 0.3s;
        }
        .btn-variant:hover, .btn-variant.active { background: var(--accent-dark); color: var(--bg-light); }

        .shape-btn {
            background: transparent; border: 1.5px solid var(--accent-dark);
            color: var(--accent-dark); width: 42px; height: 42px;
            border-radius: 50%; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; padding: 8px;
        }
        .shape-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.5; }
        .shape-btn:hover, .shape-btn.active { background: var(--accent-dark); color: var(--bg-light); }

        .footer-container {
            position: fixed; bottom: 40px; width: 100%; padding: 0 var(--page-margin);
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            z-index: 9999; pointer-events: none;
        }

        .btn-toggle {
            background: none; border: none; font-size: 10px; font-weight: 900;
            text-transform: uppercase; color: var(--accent-dark); opacity: 0.4; cursor: pointer; pointer-events: auto;
        }
        .btn-toggle.active { opacity: 1; text-decoration: underline; }
        
        .btn-reset {
            background: var(--accent-dark); color: var(--bg-light); border: none;
            padding: 10px 22px; font-size: 10px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; border-radius: 50px; pointer-events: auto;
        }
    </style>
</head>
<body id="body">

    <img id="inputImage" src="/progetti/01_workshop_coding/esercizi/esercizio_01/mc.png" alt="source">

    <header>
        <div class="header-left">
            <div class="workshop-info">Workshop 2</div>
            <div class="sub-info">High-Speed Lab</div>
        </div>
        <div class="header-buttons">
            <button class="btn-variant active" onclick="setVariant(1, this)">V.01 Particle Cloud</button>
            <button class="btn-variant" onclick="setVariant(2, this)">V.02 Fast ASCII</button>
        </div>
    </header>

    <div class="controls-left" id="pointControls">
        <span id="sliderLabel" class="slider-label">Size</span>
        <input type="range" id="sizeSlider" min="0.1" max="1.8" step="0.05" value="0.9">
    </div>

    <div class="controls-right" id="shapeControls">
        <button class="shape-btn active" onclick="setShape('circle', this)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button class="shape-btn" onclick="setShape('square', this)">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
        <button class="shape-btn" onclick="setShape('star', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </button>
    </div>

    <div class="footer-container">
        <button id="toggleNoise" class="btn-toggle active" onclick="this.classList.toggle('active')" style="text-align: left;">Reaction On</button>
        <button class="btn-reset" onclick="resetSketch()">Reset View</button>
        <div style="width: 100px;"></div> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
    <script>
        let imgData = [];
        let modalita = 1;
        let formaAttuale = 'circle';
        let gridWidth = 0, gridHeight = 0;
        const d = 5; 
        const asciiChars = "@#8W&MWB8NM".split(""); 

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pixelDensity(1); // Forziamo a 1 per massima velocità
            
            let rawImg = document.getElementById('inputImage');
            let tempImg = createImage(rawImg.width, rawImg.height);
            tempImg.drawingContext.drawImage(rawImg, 0, 0);
            tempImg.resize(tempImg.width / 1.8, 0); 
            
            tempImg.loadPixels();
            let maxX = 0, maxY = 0;

            for (let j = 0; j < tempImg.height; j++) {
                for (let i = 0; i < tempImg.width; i++) {
                    let idx = (i + j * tempImg.width) * 4;
                    let r = tempImg.pixels[idx], a = tempImg.pixels[idx+3];
                    
                    if (a > 120 && r < 250) {
                        imgData.push({
                            origX: i * d,
                            origY: j * d,
                            currX: i * d,
                            currY: j * d,
                            br: r,
                            noiseSeed: random(1000)
                        });
                        if(i > maxX) maxX = i;
                        if(j > maxY) maxY = j;
                    }
                }
            }
            gridWidth = maxX * d;
            gridHeight = maxY * d;
            rectMode(CENTER);
            noStroke();
            textFont('Geist');
            textStyle(900);
        }

        function draw() {
            background('#f5f5dc'); 
            const ox = (width - gridWidth) / 2;
            const oy = (height - gridHeight) / 2;
            const isNoiseOn = document.getElementById('toggleNoise').classList.contains('active');
            const sliderVal = document.getElementById('sizeSlider').value;
            const time = frameCount * 0.05; // Noise più veloce

            for (let p of imgData) {
                let drawX = ox + p.origX;
                let drawY = oy + p.origY;
                let val = 255 - p.br;

                if (val > 40) {
                    if (isNoiseOn) {
                        let dMouse = dist(mouseX, mouseY, drawX, drawY);
                        
                        if (modalita === 1) {
                            let radius = 180;
                            if (dMouse < radius) {
                                let force = (radius - dMouse) / radius;
                                let nX = (noise(p.noiseSeed, time) - 0.5) * 150 * force;
                                let nY = (noise(p.noiseSeed + 50, time) - 0.5) * 150 * force;
                                p.currX = lerp(p.currX, p.origX + nX, 0.2);
                                p.currY = lerp(p.currY, p.origY + nY, 0.2);
                            } else {
                                p.currX = lerp(p.currX, p.origX, 0.1);
                                p.currY = lerp(p.currY, p.origY, 0.1);
                            }
                            drawX = ox + p.currX;
                            drawY = oy + p.currY;
                        } else {
                            // ASCII FAST: Reazione immediata senza lerp per velocità
                            let radius = 130;
                            if (dMouse < radius) {
                                let force = (radius - dMouse) / radius;
                                drawX += (drawX - mouseX) * force * sliderVal;
                                drawY += (drawY - mouseY) * force * sliderVal;
                                // Aggiunta noise frenetico
                                drawX += (noise(p.noiseSeed, time) - 0.5) * 20 * force;
                                drawY += (noise(p.noiseSeed + 10, time) - 0.5) * 20 * force;
                            }
                        }
                    }

                    if (modalita === 1) {
                        let c = color('#2B1E16');
                        c.setAlpha(map(val, 40, 255, 30, 255));
                        fill(c);
                        let size = map(val, 40, 255, 0.5, d * sliderVal);
                        if (formaAttuale === 'circle') circle(drawX, drawY, size);
                        else if (formaAttuale === 'square') rect(drawX, drawY, size, size);
                        else if (formaAttuale === 'star') drawStar(drawX, drawY, size/2.2, size/1.1, 5);
                    } else {
                        let c = color('#2B1E16');
                        c.setAlpha(map(val, 40, 255, 60, 255));
                        fill(c);
                        let charIdx = floor(map(val, 40, 255, 0, asciiChars.length - 1));
                        textSize(map(val, 40, 255, 3, 8));
                        text(asciiChars[charIdx], drawX, drawY);
                    }
                }
            }
        }

        function drawStar(x, y, r1, r2, n) {
            let angle = TWO_PI / n;
            let halfAngle = angle / 2.0;
            beginShape();
            for (let a = 0; a < TWO_PI; a += angle) {
                vertex(x + cos(a) * r2, y + sin(a) * r2);
                vertex(x + cos(a + halfAngle) * r1, y + sin(a + halfAngle) * r1);
            }
            endShape(CLOSE);
        }

        function setVariant(val, btn) {
            modalita = val;
            document.querySelectorAll('.btn-variant').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('sliderLabel').innerText = (val === 1) ? "Size" : "Chaos";
            document.getElementById('shapeControls').style.display = (val === 1) ? 'flex' : 'none';
        }

        function setShape(type, btn) {
            formaAttuale = type;
            document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function resetSketch() {
            modalita = 1; formaAttuale = 'circle';
            setVariant(1, document.querySelectorAll('.btn-variant')[0]);
            setShape('circle', document.querySelectorAll('.shape-btn')[0]);
            document.getElementById('sizeSlider').value = 0.9;
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
</body>
</html>
